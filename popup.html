<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube border radius</title>
  <link rel="stylesheet" href="sakura.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>YouTube border radius</h1>
    <p>Remove rounded corners from YouTube.</p>

    <label for="toggle">
      <input id="toggle" type="checkbox" aria-describedby="hint">
      Video player only
    </label>

    <section aria-label="Preview">
      <p>Preview: <strong id="modeText">All YouTube</strong></p>
      <div id="exampleBox" class="example-all" aria-hidden="true">
        <div class="example-player-shape">Player</div>
        <div class="example-page-shape">Page cards</div>
      </div>
      <p id="hint" role="status">Off: the player and the small page cards are all square.</p>
    </section>

    <footer>
      <button id="closeBtn" type="button">Close</button>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
