<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>:3</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header class="card-header">
      <div class="title">Setting </div>
      <div class="subtitle">:3 </div>
    </header>

    <main class="card-body">
      <div class="switch-row">
        <span>Toggle (Video Player only)</span>
        <label class="switch">
          <input id="toggle" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>

      <section class="preview" aria-live="polite">
        <div class="preview-top">
          <span class="preview-title">Example</span>
          <span id="modeText" class="mode-pill">All YouTube</span>
        </div>

        <div id="exampleBox" class="example example-all" aria-label="Border radius example">
          <div class="mock-player">
            <span class="mock-info">i</span>
            <button class="mock-play" type="button" aria-label="Preview play button">
              <span></span>
            </button>
            <div class="mock-controls">
              <div class="mock-progress">
                <span class="mock-progress-played"></span>
                <span class="mock-progress-buffer"></span>
                <span class="mock-progress-dot"></span>
              </div>
              <div class="mock-control-row">
                <span class="mock-pause"></span>
                <span class="mock-next"></span>
                <span class="mock-volume"></span>
                <span class="mock-volume-line"></span>
                <span class="mock-time">3:28 / 6:45</span>
                <span class="mock-spacer"></span>
                <span class="mock-clock"></span>
                <span class="mock-gear"></span>
                <span class="mock-theater"></span>
                <span class="mock-fullscreen"></span>
              </div>
            </div>
          </div>
          <div class="mock-page-parts" aria-hidden="true">
            <span class="mock-page-card"></span>
            <span class="mock-page-card"></span>
            <span class="mock-page-card"></span>
          </div>
        </div>
      </section>

      <p id="hint" class="hint">Off: the player and the small page cards are all square.</p>

    </main>

    <footer class="card-footer">
      <button id="closeBtn" class="btn">Close</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
